# 项目相关配置
howe:
  # 名称
  name: 后端服务
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 本地文件路径：仅在存储类型为 local 时用于存放上传文件，以及通用下载接口的取件目录
  # 示例（ Windows配置D:/howe/uploadPath，Linux/容器配置 /app/uploadPath）
  # 存储类型、R2 凭据、博客 GitHub 配置都在「系统管理 > 参数设置」里维护，不写在这里
  profile: ${PROFILE_PATH:D:/howe/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为9527
  port: ${SERVER_PORT:9527}
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.howe: ${LOGGING_LEVEL_APP:debug}
    org.springframework: ${LOGGING_LEVEL_SPRING:warn}

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: ${REDIS_HOST:localhost}
      # 端口，默认为6379
      port: ${REDIS_PORT:6379}
      # 数据库索引
      database: ${REDIS_DATABASE:0}
      # 密码
      password: ${REDIS_PASSWORD:}
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${JWT_SECRET:abcdefghijklmnopqrstuvwxyz}
  # 令牌有效期（默认30分钟）
  expireTime: ${JWT_EXPIRATION:30}

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.howe.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  # 分组按业务域拆。原先只扫 com.howe.web.controller.tool，导致文档里只有 TestController，
  # 其余 26 个 controller 全都看不见。注意 blog/quartz/generator 的 controller 不在 com.howe.web 下
  group-configs:
    - group: '01-系统管理'
      display-name: '系统管理'
      paths-to-match: '/**'
      packages-to-scan: com.howe.web.controller.system
    - group: '02-系统监控'
      display-name: '系统监控'
      paths-to-match: '/**'
      packages-to-scan: com.howe.web.controller.monitor
    - group: '03-通用接口'
      display-name: '通用接口'
      paths-to-match: '/**'
      packages-to-scan: com.howe.web.controller.common
    - group: '04-博客管理'
      display-name: '博客管理'
      paths-to-match: '/**'
      packages-to-scan: com.howe.blog.controller
    - group: '05-定时任务'
      display-name: '定时任务'
      paths-to-match: '/**'
      packages-to-scan: com.howe.quartz.controller
    - group: '06-代码生成'
      display-name: '代码生成'
      paths-to-match: '/**'
      packages-to-scan: com.howe.generator.controller
    - group: '99-全部接口'
      # 以 0 开头让它在 swagger-ui 的分组下拉里排第一、默认选中显示全部接口
      # （swagger-config 的 urls 按 display-name 的 Unicode 码点升序排列，与 group 前缀无关）
      display-name: '0-全部接口'
      paths-to-match: '/**'
      packages-to-scan: com.howe

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,wyantao.com,www.wyantao.com

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
